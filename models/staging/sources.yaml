version: 2
sources:
  - name: raw
    schema: main
    description: |
      This source contains the staging data for various entities.
    tables:
      - name: al_raw_data
        description: |
          Contains raw data on AL
      - name: azores_al_raw_data
        description: |
          The Azorean regional AL register (RRAL), already cleansed by
          scripts/fetch_azores.py. Loaded by run_etl.sh from the glob of
          monthly pulls in downloads/azores, with the pull timestamp parsed
          from each filename. Carries no registration dates - see
          models/staging/stg_azores_al.sql.
      - name: al_geocoded
        description: |
          A coordinate for every registration ever seen, with how it was
          found (scripts/geocode_al.py, against INE's Base Nacional de Moradas,
          CC BY 4.0). Committed so CI can build without the address file.
          Input only: the site never publishes a point.
        config:
          external_location: "downloads/geocode/al_geocoded.csv.gz"
  - name: geojson
    tables:
      - name: admin
        config:
          external_location: "downloads/osm/admin.geojson"
      