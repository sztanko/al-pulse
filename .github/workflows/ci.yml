# Build and verify on a pull request, without deploying.
#
# static.yml only fires on a push to main, so before this a PR carried no
# checks at all and merging was the first time anything ran. That is a poor
# trade on a repo whose deploy takes ten minutes and whose failure mode is a
# stale site.
#
# Same steps as the deploy, minus the Pages upload.
name: CI

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install DuckDB
        run: |
          set -euo pipefail
          VERSION=v1.1.3
          curl -fsSL -o /tmp/duckdb.zip \
            "https://github.com/duckdb/duckdb/releases/download/${VERSION}/duckdb_cli-linux-amd64.zip"
          unzip -q -o /tmp/duckdb.zip -d /usr/local/bin
          chmod +x /usr/local/bin/duckdb
          duckdb --version

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ETL
        run: ./scripts/run_etl.sh

      - name: Build site
        run: ./scripts/run_report.sh

      - name: Verify built site
        run: |
          cd site
          npx playwright install --with-deps chromium
          npm run verify

      # A rewrite that silently stops producing pages would still pass every
      # check above, so assert the shape of the output too.
      - name: Check the output is the size it should be
        run: |
          set -euo pipefail
          PAGES=$(find site/dist/areas -name index.html | wc -l)
          PT_PAGES=$(find site/dist/pt/areas -name index.html | wc -l)
          echo "area pages: $PAGES english, $PT_PAGES portuguese"
          test "$PAGES" -ge 2700 || { echo "only $PAGES area pages built"; exit 1; }
          # The two trees must match exactly. A language that quietly builds
          # fewer pages than the other is a routing bug that no screenshot and
          # no smoke test would show.
          test "$PT_PAGES" -eq "$PAGES" || {
            echo "language trees disagree: $PAGES vs $PT_PAGES"; exit 1; }
          for p in site/dist/index.html site/dist/map/index.html \
                   site/dist/method/index.html site/dist/areas/index.html \
                   site/dist/pt/index.html site/dist/pt/map/index.html \
                   site/dist/pt/method/index.html site/dist/pt/areas/index.html \
                   site/dist/geo/localities.json \
                   site/dist/geo/districts/faro.json; do
            test -s "$p" || { echo "missing or empty: $p"; exit 1; }
          done
          DRAWINGS=$(ls site/dist/geo/districts/*.json | wc -l)
          echo "district drawings: $DRAWINGS"
          test "$DRAWINGS" -eq 20 || { echo "expected 20 district drawings"; exit 1; }
          echo "output looks right"
