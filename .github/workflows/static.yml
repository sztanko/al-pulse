# Build the static site and deploy it to GitHub Pages.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - "downloads/al/**"
      - "downloads/azores/**"
      - "downloads/postal_code/**"
      - "scripts/**"
      - "models/**"
      - "macros/**"
      - "seeds/**"
      - "requirements.txt"
      - "dbt_project.yml"
      - .github/workflows/static.yml

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      # Installed directly rather than through a third-party action: the
      # opt-nc/setup-duckdb-action step failed the 2026-09-17 deploy with a
      # bare HTTP 403 from the GitHub API, which is a failure mode entirely
      # outside this repository.
      - name: Install DuckDB
        run: |
          set -euo pipefail
          VERSION=v1.1.3
          curl -fsSL -o /tmp/duckdb.zip \
            "https://github.com/duckdb/duckdb/releases/download/${VERSION}/duckdb_cli-linux-amd64.zip"
          unzip -q -o /tmp/duckdb.zip -d /usr/local/bin
          chmod +x /usr/local/bin/duckdb
          duckdb --version

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ETL
        run: ./scripts/run_etl.sh

      - name: Build site
        run: ./scripts/run_report.sh

      # The checks a screenshot cannot make: horizontal overflow, controls
      # covered by the sticky header, console errors, and that the growth
      # slider actually redraws. Runs against the built output.
      - name: Verify built site
        run: |
          cd site
          npx playwright install --with-deps chromium
          npm run verify

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
